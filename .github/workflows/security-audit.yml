name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security-audit.yml"
      - ".github/scripts/check-vendored-c-libs.sh"
      - "deny.toml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security-audit.yml"
      - ".github/scripts/check-vendored-c-libs.sh"
      - "deny.toml"
  schedule:
    # Daily at 07:00 AEST (21:00 UTC) — catch new RUSTSEC advisories
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the post-v2.0.0 commit that migrated from Node.js 20
      # (deprecated, removed from the runner in Sep 2026) to Node.js 24.
      # Upstream hasn't tagged a release since — bump to the next tag
      # when rustsec/audit-check cuts one.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      # bilbycast-edge/Cargo.toml has path dependencies on seven sibling
      # repos (../bilbycast-fdk-aac-rs, ../bilbycast-ffmpeg-video-rs,
      # ../bilbycast-libsrt-rs, ../bilbycast-rist, ../bilbycast-bonding,
      # ../bilbycast-mxl-rs, ../bilbycast-decklink-rs). `cargo metadata`
      # must read every path dependency's manifest to build the dependency
      # graph — including `optional = true` ones whose feature is off — so
      # a missing sibling directory fails the run outright, not just under
      # --all-features. Mirror the nightly-release layout: check everything
      # out into peer directories of the workspace root, then point
      # cargo-deny at ./bilbycast-edge/Cargo.toml so the relative `..`
      # references resolve correctly.
      - name: Checkout bilbycast-libsrt-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-libsrt-rs
          path: bilbycast-libsrt-rs

      - name: Checkout bilbycast-fdk-aac-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-fdk-aac-rs
          path: bilbycast-fdk-aac-rs

      - name: Checkout bilbycast-ffmpeg-video-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-ffmpeg-video-rs
          path: bilbycast-ffmpeg-video-rs

      - name: Checkout bilbycast-rist (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-rist
          path: bilbycast-rist

      - name: Checkout bilbycast-bonding (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-bonding
          path: bilbycast-bonding

      - name: Checkout bilbycast-mxl-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-mxl-rs
          path: bilbycast-mxl-rs
          submodules: recursive

      - name: Checkout bilbycast-decklink-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-decklink-rs
          path: bilbycast-decklink-rs

      - name: Checkout bilbycast-rga-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-rga-rs
          path: bilbycast-rga-rs

      - name: Checkout bilbycast-edge
        uses: actions/checkout@v7
        with:
          path: bilbycast-edge

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          manifest-path: ./bilbycast-edge/Cargo.toml

  # cargo-audit and cargo-deny read the *Rust* dependency graph via
  # `cargo metadata`. Neither has any concept of a git submodule holding C
  # source, so neither can flag a vulnerable libsrt / FFmpeg / opus pin —
  # regardless of whether the submodule content is checked out. That blind
  # spot let libsrt v1.5.5 stay vendored for 9 days after v1.5.6 patched
  # CVE-2026-55869 + CVE-2026-55868 (both CVSS 9.1, both reachable
  # pre-authentication on a public SRT listener). This job closes it by
  # diffing each pinned gitlink against upstream's release tags.
  #
  # Only the parent repos are checked out (no `submodules:`): the script
  # needs the gitlink SHA, which lives in the parent tree, plus
  # `git ls-remote` on upstream. Nothing is cloned from git.ffmpeg.org or
  # gitlab.xiph.org, so this job does not inherit their flakiness.
  vendored-c-libs:
    name: vendored C libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bilbycast-libsrt-rs
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-libsrt-rs
          path: bilbycast-libsrt-rs

      - name: Checkout bilbycast-ffmpeg-video-rs
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-ffmpeg-video-rs
          path: bilbycast-ffmpeg-video-rs

      - name: Checkout bilbycast-fdk-aac-rs
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-fdk-aac-rs
          path: bilbycast-fdk-aac-rs

      - name: Checkout bilbycast-mxl-rs
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-mxl-rs
          path: bilbycast-mxl-rs

      - name: Checkout bilbycast-edge
        uses: actions/checkout@v7
        with:
          path: bilbycast-edge

      - name: Compare vendored C pins against upstream releases
        run: bash bilbycast-edge/.github/scripts/check-vendored-c-libs.sh .
