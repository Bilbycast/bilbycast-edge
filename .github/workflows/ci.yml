name: CI

# Compile-check every pull request.
#
# Why this exists: nothing else builds the edge on a PR. codeql.yml runs
# `build-mode: none`, security-audit.yml only runs `cargo metadata`, and
# nightly-release.yml builds on tags — so a PR could red the tree and nobody
# would know until release. That is not hypothetical: ffmpeg-video-rs #3 added
# two required fields to `VideoEncoderConfig`, which broke `main` outright
# (E0063 in video_encode_util.rs) and went unnoticed precisely because of this
# gap. A local checkout hides it whenever the ffmpeg-video-rs sibling is parked
# on a branch cut before the change.
#
# Scope is deliberately the DEFAULT feature set. That is where the sibling-crate
# API drift bites, and it is what every operator gets from `cargo build`. The
# GPL / vendor-specific encoder features are left to nightly-release: they add
# heavy apt deps for little extra API coverage.
#
# `sdi-decklink` is the exception, and it is covered — see the SDI compile gate
# in the `check` job. libdecklink-sys/build.rs hard-requires the Blackmagic SDK
# headers (DECKLINK_SDK_DIR), which are EULA-gated and deliberately not vendored
# (unlike mxl, which vendors its headers under Apache-2.0 and so can use
# `mxl-not-built`), so the gate pulls them from the private SDK repo and runs
# only when a credential is available. It is compile-only — no card, no Desktop
# Video. Fork PRs get no secrets, so it skips there rather than failing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (default features)
    runs-on: ubuntu-24.04
    env:
      # The `secrets` context is NOT available in a step-level `if:` — only in
      # `with:`/`env:`. Collapse "do we have a DeckLink SDK credential?" to a
      # plain env string here so the SDI steps below can branch on it.
      HAS_DECKLINK_SDK: ${{ secrets.DECKLINK_SDK_DEPLOY_KEY != '' || secrets.DECKLINK_SDK_TOKEN != '' }}
    steps:
      # bilbycast-edge/Cargo.toml path-depends on seven sibling repos. cargo
      # reads every path dependency's manifest when building the dependency
      # graph — including `optional = true` ones whose feature is off — so all
      # of them must exist even for a default-feature check. Peer directories
      # of the workspace root, so the relative `..` references resolve.
      - name: Checkout bilbycast-libsrt-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-libsrt-rs
          path: bilbycast-libsrt-rs
          submodules: recursive

      - name: Checkout bilbycast-fdk-aac-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-fdk-aac-rs
          path: bilbycast-fdk-aac-rs
          submodules: recursive

      # Submodules are fetched in a separate retry step below, not by the
      # checkout action: the vendored FFmpeg / opus submodules live on
      # git.ffmpeg.org and gitlab.xiph.org, which return transient 502s often
      # enough that the action's two immediate retries are not enough. Full
      # history because git.ffmpeg.org will not serve the pinned commit to a
      # shallow request ("Server does not allow request for unadvertised
      # object").
      - name: Checkout bilbycast-ffmpeg-video-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-ffmpeg-video-rs
          path: bilbycast-ffmpeg-video-rs
          fetch-depth: 0

      - name: Fetch bilbycast-ffmpeg-video-rs submodules (with retry)
        working-directory: bilbycast-ffmpeg-video-rs
        run: |
          # Ride out a rough patch on the upstream git servers rather than
          # failing the whole build on one 502.
          for attempt in 1 2 3 4 5 6; do
            if git submodule update --init --recursive --jobs 3; then
              echo "submodules fetched on attempt ${attempt}"
              exit 0
            fi
            echo "submodule fetch attempt ${attempt} failed; retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          echo "submodule fetch failed after 6 attempts — upstream git servers " \
               "(git.ffmpeg.org / gitlab.xiph.org) appear to be down." >&2
          exit 1

      - name: Checkout bilbycast-rist (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-rist
          path: bilbycast-rist
          submodules: recursive

      - name: Checkout bilbycast-bonding (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-bonding
          path: bilbycast-bonding

      - name: Checkout bilbycast-mxl-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-mxl-rs
          path: bilbycast-mxl-rs
          submodules: recursive

      - name: Checkout bilbycast-decklink-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-decklink-rs
          path: bilbycast-decklink-rs

      - name: Checkout bilbycast-rga-rs (path dependency)
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-rga-rs
          path: bilbycast-rga-rs

      - name: Checkout bilbycast-edge
        uses: actions/checkout@v7
        with:
          path: bilbycast-edge

      - name: Install build dependencies
        run: |
          # Same default-feature set as a plain `cargo build`: libsrt (cmake,
          # clang, openssl), vendored FFmpeg via media-codecs (nasm), and the
          # `display` output's alsa-sys link (libasound2-dev).
          sudo apt-get update
          # `libx264-dev` is for the multiviewer gates below, not the default
          # set: without a `video-encoder-*` feature the mosaic compiles but
          # every one of its encoder-resolution tests short-circuits, because
          # `any_video_encoder_compiled()` is false and no chain ever resolves.
          # One apt package is what makes those assertions actually run.
          sudo apt-get install -y cmake make clang libclang-dev pkg-config \
            libssl-dev g++ libasound2-dev nasm libx264-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The vendored FFmpeg build dominates a cold run. Keyed on Cargo.lock with
      # a prefix restore-key so an unrelated dep bump still reuses the C build.
      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bilbycast-edge/target
          key: ci-check-cargo-edge-${{ hashFiles('bilbycast-edge/Cargo.lock') }}
          restore-keys: |
            ci-check-cargo-edge-

      - name: cargo check
        working-directory: bilbycast-edge
        run: cargo check --all-targets --locked

      # ─── Multiviewer compile + lint gate ─────────────────────────────────
      # `multiviewer` is off by default, so without this nothing in CI compiles
      # `engine::input_mosaic` at all. It matters more than an ordinary
      # coverage hole: the feature's only callers of `video-engine`'s
      # `av_pix_fmt_bgra` live inside that module, and every sibling repo is
      # checked out at its DEFAULT BRANCH with no `ref:` pin — so without this
      # step nothing would ever notice bilbycast-edge and
      # bilbycast-ffmpeg-video-rs disagreeing about that API. Same hole
      # `sdi-decklink` sat in until the gate below it was written.
      #
      # Unconditional and cheap: `multiviewer` implies only `media-codecs`,
      # already in the default set, and it reuses the target dir `cargo check`
      # just filled. docs/MULTIVIEWER_PLAN.md §6.3 item 1.
      #
      # **Paired with `video-encoder-x264`**, which costs one apt package and is
      # what makes the encoder half testable at all. Without a `video-encoder-*`
      # feature `any_video_encoder_compiled()` is false, `canvas_backend_chain`
      # refuses before it resolves, and every assertion about which backend a
      # wall picks passes vacuously — including the synthetic-capabilities test
      # §6 requires precisely so the rk3588 case is covered on an x86 runner.
      # GPL is not a concern here: CI builds nothing that is distributed.
      #
      # **Clippy only, no separate `cargo check`.** §6.3 lists both, and a
      # `cargo check --all-targets --locked --features multiviewer` step did
      # ship here briefly. It is strictly redundant: clippy-driver runs rustc's
      # full analysis over the identical `--all-targets` set under the identical
      # feature, so a compile error fails this step too. Keeping it bought a
      # marginally clearer first-failure message for ~80 s of every run. Note
      # the redundancy was self-inflicted — the plan asked for `check` steps
      # because at the time no clippy-with-feature step was proposed.
      - name: cargo clippy (multiviewer)
        working-directory: bilbycast-edge
        run: cargo clippy --all-targets --locked --features "multiviewer video-encoder-x264" -- -D warnings

      # ─── SDI (DeckLink) compile gate ─────────────────────────────────────
      # The ~2.2k lines behind `sdi-decklink` were never compiled anywhere in
      # CI, because the release workflow drops the feature whenever the SDK
      # credential is absent. That gap is precisely how the edge's SDI code
      # drifted ahead of decklink-rs — calling `api_available`,
      # `read_frame_timeout` and a 3-arg `write_video_with_ancillary` that
      # existed in no committed branch — and went unnoticed for months
      # (issue #76, item B). This closes it.
      #
      # Compile-only, so no DeckLink card and no Desktop Video are needed:
      # DeckLinkAPIDispatch.cpp dlopens libDeckLinkAPI.so at RUNTIME, and only
      # the headers are a build-time input.
      #
      # SKIPPED, not failed, when no credential is available. Fork PRs never
      # receive secrets, and hard-failing there would red-line every outside
      # contribution for a feature they cannot build. On this repo's own
      # branches the credential is present and the gate always runs.
      - name: Checkout DeckLink SDK headers (private)
        if: env.HAS_DECKLINK_SDK == 'true'
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/bilbycast-decklink-sdk
          ssh-key: ${{ secrets.DECKLINK_SDK_DEPLOY_KEY }}
          token: ${{ secrets.DECKLINK_SDK_TOKEN || github.token }}
          path: decklink-sdk

      - name: cargo check (sdi-decklink)
        if: env.HAS_DECKLINK_SDK == 'true'
        working-directory: bilbycast-edge
        run: |
          # Locate rather than assume a layout, so the SDK repo may keep the
          # vendor's `Linux/include` nesting or flatten it — same tolerance the
          # release workflow has.
          API_H="$(find ../decklink-sdk -type f -name DeckLinkAPI.h -print -quit)"
          if [ -z "${API_H}" ]; then
            echo "ERROR: DeckLinkAPI.h not found in the decklink-sdk checkout." >&2
            echo "       The repo must contain the SDK's Linux/include directory." >&2
            exit 1
          fi
          # MUST be absolute. This step runs with working-directory
          # bilbycast-edge, but libdecklink-sys/build.rs runs with cwd set to
          # its OWN crate dir, so a relative DECKLINK_SDK_DIR resolves against
          # the wrong root and build.rs panics with "does not look like the
          # SDK's Linux/include". Caught by run 31471223148.
          DECKLINK_SDK_DIR="$(cd "$(dirname "${API_H}")" && pwd)"
          export DECKLINK_SDK_DIR
          if [ ! -f "${DECKLINK_SDK_DIR}/DeckLinkAPIDispatch.cpp" ]; then
            echo "ERROR: found DeckLinkAPI.h but no DeckLinkAPIDispatch.cpp beside it" >&2
            echo "       in ${DECKLINK_SDK_DIR}. Both are required." >&2
            exit 1
          fi
          echo "DECKLINK_SDK_DIR=${DECKLINK_SDK_DIR}"
          cargo check --all-targets --locked --features sdi-decklink

      - name: SDI compile gate skipped (no SDK credential)
        if: env.HAS_DECKLINK_SDK != 'true'
        run: |
          echo "::notice title=SDI compile gate skipped::No DeckLink SDK credential is available to this run (expected on fork PRs), so 'cargo check --features sdi-decklink' did not run. See docs/sdi.md."

      # Lint gate. A step in this job rather than a job of its own for the same
      # reason as `cargo test` below: a parallel job would re-clone all eight
      # sibling repos and rebuild the vendored FFmpeg from cold, which dwarfs
      # the lint itself. Clippy reuses the target dir `cargo check` just filled.
      #
      # The accepted-lint set lives in `[lints.clippy]` in bilbycast-edge's
      # Cargo.toml, one documented reason per entry — so this is `-D warnings`
      # with no inline `-A` flags to drift out of sync with the manifest.
      # Nothing ran clippy before this: the tree had accumulated 1063 lints
      # unnoticed, which is what motivated the gate.
      - name: cargo clippy
        working-directory: bilbycast-edge
        run: cargo clippy --all-targets --locked -- -D warnings

      # Run the unit/integration test suite. Added as a step in this job
      # rather than a separate job on purpose: a parallel job would re-clone
      # all eight sibling repos and rebuild the vendored FFmpeg from cold
      # (the dominant cost), for no extra coverage. `cargo test` here reuses
      # the target dir `cargo check` just populated — only the test-mode
      # codegen is new. Before this step existed nothing ran the suite on a
      # PR: CI was compile-only, so a green tree could still ship a failing
      # test. See MEDIA_PLAYER_HOLISTIC_REDESIGN_PLAN.md Phase 0.
      - name: cargo test
        working-directory: bilbycast-edge
        run: cargo test --all-targets --locked

      # Run the multiviewer suite. Until this step, `engine::input_mosaic`'s 13
      # tests were type-checked by the gate above and executed nowhere.
      #
      # The gap was only ever those 13, which is worth stating because it is
      # easy to over-claim: `engine::mosaic` is NOT behind the feature
      # (`src/engine/mod.rs` gates `input_mosaic` alone), so its 24 tests have
      # always run in the step above. Verified by running them on a default
      # build: 24 passed.
      #
      # `--lib` plus ONE named integration target, not `--all-targets`, and
      # that is the cost argument. Nearly every test the feature adds lives in a
      # lib module, so this builds two test binaries instead of re-linking every
      # integration target under a second feature set. Measured locally at ~2
      # min against a warm target dir, against the ~80 s reclaimed by dropping
      # the redundant `cargo check` above — net roughly +40 s on a ~20 min job.
      #
      # `mosaic_wire_shape` is named explicitly because it is the edge half of a
      # cross-repo contract — it pins the exact JSON body bilbycast-manager's
      # `compile_wall` emits for a deployed wall — and `--lib` alone would skip
      # it. A contract test nothing runs is worse than no contract test: the
      # push path is raw JSON, so a renamed field is a silent default on both
      # sides rather than a compile error anywhere.
      - name: cargo test (multiviewer)
        working-directory: bilbycast-edge
        run: cargo test --locked --features "multiviewer video-encoder-x264" --lib --test mosaic_wire_shape
