# cargo-audit configuration. Mirrors the [advisories] ignore list in
# deny.toml — both checks run side-by-side in the Security audit
# workflow and need to share an allowlist or the run goes red.

[advisories]
ignore = [
    # rustls-pemfile 2.2.0 — crate archived August 2025, code lives on
    # inside rustls-pki-types via the PemObject trait. Not a CVE.
    "RUSTSEC-2025-0134",
    # paste 1.0.15 — unmaintained (author archived the repo). Compile-time
    # proc-macro helper with no runtime surface, transitive via
    # netlink-packet-core (the netlink stack behind network-interface
    # enumeration). Not a vulnerability; no patched version exists.
    # TODO: drop when the netlink stack moves off it.
    "RUSTSEC-2024-0436",
]
