[package]
name = "bilbycast-edge"
version = "0.114.1"
edition = "2024"
description = "Pure-Rust media gateway: RTP, SRT, RTMP, HLS, WebRTC with SMPTE 2022-1/7, TR-101290, and RP 2129"
license = "AGPL-3.0-or-later"
# Binary distribution only — published as signed release artefacts by the
# GitHub Actions workflow, never as a crates.io library crate. Also flips
# cargo-deny's `allow-wildcard-paths` rule so the sibling path-deps
# (../bilbycast-fdk-aac-rs/*, etc.) stop generating wildcard warnings.
publish = false

# Clippy policy. CI runs `cargo clippy --all-targets --locked -- -D warnings`,
# so anything not allowed here is a build failure. Every entry below is a
# deliberate exemption with a reason — do not add one to silence a lint you
# simply have not looked at.
#
# The first group is toolchain churn, not code debt: clippy 1.95 expanded
# these to fire on shapes that were idiomatic when written, and rewriting
# ~650 call sites across the engine to satisfy them would be unreviewable
# and would bury real findings.
[lints.clippy]
# Doc-comment list formatting only. No effect on rendered rustdoc for our style.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"

# The second group is where clippy's suggested fix is actively wrong for this
# codebase.
#
# The suggested fix is to Box the large variant. These enums carry media
# payloads on the packet path, where an extra heap allocation per packet
# violates the "never block the data path" constraint (root CLAUDE.md #1).
# Trading a fixed stack cost for a per-packet malloc is the wrong direction.
large_enum_variant = "allow"
# Fires on `let _ = spawn_*(…)` where the helper is a plain `fn` returning a
# JoinHandle, not an `async fn`. The body runs at the call; only the handle is
# dropped, which is a deliberate detached task. Verified all 8 sites 2026-08-11.
let_underscore_future = "allow"
# Would add ~21 `Default` impls that nothing constructs, i.e. dead code — which
# the project bar forbids outright. Revisit per-type if a caller ever wants one.
new_without_default = "allow"
# Wants type aliases for signatures that are already local and self-describing.
# Cosmetic, and the alias indirection reads worse at the use site.
type_complexity = "allow"
# Fires on codec bit-field construction, where the "redundant" term IS the
# documentation of the wire layout:
#     hdr[5] = (8 << 3) | 0;                       // bsid=8, bsmod=0
#     p[21]  = ((channel_config & 0x03) << 6) | 0x00;
# Folding those to `8 << 3` deletes the statement that the low field is zero,
# which is exactly what a reader checking against the spec needs to see.
identity_op = "allow"
# New in clippy 1.95. Wants `if sr > 0 { pts += n * 90_000 / sr }` rewritten as
# `checked_div` + `if let`, which is longer and states less: the guard means
# "the sample rate is not known yet", which is the condition the reader cares
# about, not "this division might trap".
manual_checked_ops = "allow"
# New in clippy 1.98, and it turned `main` red on a toolchain bump alone — CI
# installs the current stable toolchain (`toolchain: stable`), so 32
# pre-existing call sites became errors under `-D warnings` with no commit
# touching them.
#
# The suggestion is not a rename. `chunks_exact(TS_PACKET_SIZE)` yields
# `&[u8]`; `as_chunks::<TS_PACKET_SIZE>().0` yields `&[[u8; 188]]`, so every
# loop body would be retyped from slice to fixed array. That is a mechanical
# edit across the TS demux, the PID filter and the PTS rewriter — the packet
# hot path — for no functional or performance gain, and the two forms discard
# the trailing partial chunk identically. Not a risk worth taking on the paths
# where a mistake is a corrupted transport stream.
chunks_exact_to_as_chunks = "allow"
# Index arithmetic over byte, sample and pixel buffers is the domain language
# here — `for b in dpos + 2..dpos + 2 + dlen` walks a descriptor body, and the
# iterator rewrite is longer and easier to get wrong. Rewriting 27 such loops
# in TS-parsing and DSP code risks real defects for no functional gain.
needless_range_loop = "allow"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7.19"
# Bridges `tokio::sync::mpsc::Receiver<T>` to `futures::Stream<Item=T>`,
# which reqwest::Body::wrap_stream expects (used by CMAF-LL chunked PUT).
tokio-stream = "0.1.19"

# HTTP framework
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# Time
chrono = "0.4.45"

# Concurrency
# PINNED to a release candidate on purpose, and the version number is
# misleading: the 7.0 line is STALLED, not merely unreleased. 7.0.0-rc2 was
# published 2025-03-05, there has never been an rc3, and upstream went on to
# publish stable 6.2.1 on 2026-05-17 — fourteen months LATER. No fix will ever
# land on rc2, and an advisory against it would have no upgrade path. It is NOT
# drift; do not "refresh" it to 6.2.1 without doing the attached work.
#
# The requirement is `=7.0.0-rc2`, EXACT, and that matters: a caret on a
# prerelease crosses to later prereleases of the same base version, so plain
# "7.0.0-rc2" would take an rc3 or a 7.0.0 final on the next `cargo update`
# — the routine bump procedure this monorepo uses, since dependabot's cargo
# ecosystem is deliberately off — and land it in the hot-path registries with
# no review. Nothing in [7.0.0-rc2, 8.0.0) has been published since
# 2025-03-05, but the range would have taken it silently.
#
# Reverting to 6.2.1 is API-clean for our usage — every call site is `DashMap`,
# `DashMap::new` or `Entry`, both versions re-export Entry/OccupiedEntry/
# VacantEntry at the crate root, what 7.0 removed (the `Map` trait and
# `SharedValue` — `raw-api` is declared in BOTH versions and was not removed)
# appears nowhere here, and no manifest declares a dashmap feature. The lookup
# bounds on get/remove/contains_key/remove_if do differ — `K: Borrow<Q>, Q:
# Hash + Eq` in 6.2.1 against `Q: Hash + Equivalent<K>` in rc2 — which is
# compile-compatible for our keys only because `equivalent`'s single impl is
# the Borrow blanket. A revert also drags hashbrown 0.14.5 and once_cell into
# three graphs that carry no 0.14.x, and steps back to edition 2018 / MSRV
# 1.65. What stops it being a free swap is that 7.0
# replaced hashbrown's RawTable with HashTable internally, and these maps are
# the lock-free hot-path registries of Key Design Constraints #1/#2. Bench the
# registries before moving, in edge, manager and relay together.
dashmap = "=7.0.0-rc2"
arc-swap = "1.9"

# Byte buffers
bytes = "1.12.1"

# Enum utilities
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"

# Socket config
socket2 = "0.6.5"
libc = "0.2.190"

# Network interface enumeration (used by util::network_interfaces to populate
# HealthPayload.network_interfaces — name, IPv4/IPv6, MAC, MTU, loopback).
# Pure Rust, cross-platform, MIT — no new C deps. Linux-only fields (link
# speed, operstate) are read directly from /sys/class/net/<iface>/.
if-addrs = "0.15"

# Random
rand = "0.10.3"

# Pure-Rust audio sample rate conversion (used by the per-output PCM
# transcode stage in `engine::audio_transcode` to bridge mismatched
# ST 2110-30 / -31 / rtp_audio formats and feed the SMPTE 302M-over-SRT
# pipeline). No C deps.
rubato = "5.0.1"

# Pure-Rust audio codec decoder (used by `engine::audio_decode` to convert
# ── AAC backend ─────────────────────────────────────────────────────────
# Default: fdk-aac (C library via FFI). Supports AAC-LC, HE-AAC v1/v2,
# multichannel up to 7.1, AAC-LD/ELD. Used for both decode and encode.
# Fallback: symphonia (pure Rust, AAC-LC mono/stereo only).
#
# To disable fdk-aac: cargo build --no-default-features --features tls,webrtc
# ────────────────────────────────────────────────────────────────────────
aac-audio = { path = "../bilbycast-fdk-aac-rs/aac-audio", optional = true }
aac-codec = { path = "../bilbycast-fdk-aac-rs/aac-codec", optional = true }
# 0.6.0 reworked the audio API wholesale — `AudioBufferRef` -> `GenericAudioBufferRef`,
# `Signal` -> `Audio`, `SignalSpec` -> `AudioSpec`, `Channels` from a bitflags set to
# an enum wrapping `Position`, and the codec types split into `codecs::audio::*`
# (`CodecParameters` -> `AudioCodecParameters`, `DecoderOptions` -> `AudioDecoderOptions`,
# `CODEC_TYPE_AAC` -> `well_known::CODEC_ID_AAC`). The port lives in the
# `#[cfg(not(feature = "fdk-aac"))]` half of `engine::audio_decode`.
#
# This was previously held on the claim that the fallback "does NOT compile at
# present" because a bare `--no-default-features` build fails on unrelated
# `media-codecs` gating. That conflated two different configurations. The
# symphonia decoder needs `fdk-aac` off, NOT `media-codecs` off, and
# `--no-default-features --features tls,webrtc,media-codecs,replay` builds and
# its tests pass. (Note `display` implies `fdk-aac`, so it must be dropped too —
# leaving it on silently re-enables fdk-aac and hides the symphonia path.)
# That config is not warning-clean — it carries ~12 pre-existing dead-code
# warnings — and it is not CI-gated; CI checks default features only.
#
# The `media-codecs`-off gating defects that motivated the original hold are
# fixed here (stub `ResolvedBackendCell` + `ProbeUnavailable`, two `#[cfg]`
# corrections in `thumbnail.rs`), so `--no-default-features --features
# tls,webrtc,replay` now compiles where it previously did not. A *bare*
# `--no-default-features` build still fails, but the remaining ~29 errors are
# `webrtc` gating in `engine::output_webrtc` plus one E0308 in
# `manager::client` — no longer a media-codecs problem. Tracked separately.
#
# Still true, and the reason this stays a fallback: no shipped release artefact
# exercises it. All three publish with `display` on, which forces `fdk-aac`, so
# fdk-aac is the active AAC decoder everywhere in production.
symphonia = { version = "0.6.1", features = ["aac"], default-features = false }

# ── FFmpeg / libav base codec layer (the `media-codecs` feature) ──────
# In-process video decode, JPEG thumbnail encode, audio decode/encode
# for Opus/MP2/AC-3/E-AC-3, and HW probe scaffolding — all via FFmpeg
# C libraries vendored through bilbycast-ffmpeg-video-rs. Replaces the
# ffmpeg subprocess.
#
# To disable: cargo build --no-default-features --features tls,webrtc,fdk-aac
# (off-build loses non-AAC audio + CPU video decode + thumbnails)
# ────────────────────────────────────────────────────────────────────────
video-engine = { path = "../bilbycast-ffmpeg-video-rs/video-engine", optional = true }
video-codec = { path = "../bilbycast-ffmpeg-video-rs/video-codec", optional = true }

# ── MXL (Media eXchange Layer, the `mxl` feature) ─────────────────────
# EBU / Linux Foundation cloud-native broadcast composition layer
# (Apache-2.0). Wraps the `dmf-mxl/mxl` upstream Rust crate pinned to
# v1.0.1 via the sibling `bilbycast-mxl-rs` workspace, which carries
# the upstream as a git submodule + libmxl C++ source builds via
# CMake/Ninja/Clang + vcpkg.
#
# Heavy build prereq footprint — see `bilbycast-mxl-rs/CLAUDE.md`.
# Default OFF; the small set of contribution-grade installs that need
# uncompressed on-host composition opt in explicitly.
# ────────────────────────────────────────────────────────────────────────
mxl-rs = { path = "../bilbycast-mxl-rs/mxl-rs", optional = true }

# ── SDI capture/playout via Blackmagic DeckLink (the `sdi-decklink` feature) ─
# Talks to the Blackmagic DeckLink SDK directly via a C++ shim (see
# `bilbycast-decklink-rs`), NOT FFmpeg's libavdevice `decklink` device — the
# avdevice path hides `bmdFrameHasNoInputSource`, so a pulled cable is
# indistinguishable from a live feed. Build needs only the SDK headers
# (`DECKLINK_SDK_DIR`); `libDeckLinkAPI.so` is dlopened at runtime by Desktop
# Video. No FFmpeg rebuild, no non-free linkage. Default OFF. Sibling-path
# dependency, mirroring `mxl-rs` (both are Bilbycast-org workspace crates).
decklink-rs = { path = "../bilbycast-decklink-rs/decklink-rs", optional = true }

# ── Rockchip RGA 2D-accelerator transfers (the `rga-transfer` feature) ───────
# Hardware DRM_PRIME dma-buf → sysmem NV12 copy on RK3568 / RK3588, replacing
# FFmpeg's generic CPU mmap + DMA_BUF_SYNC + memcpy in the local-display path.
# The `librga` FFI + its bindgen build script live in the sibling workspace,
# NOT here: bilbycast-edge is pure-Rust source and carries no build.rs, no
# `.h`/`.c` files and no bindgen dependency — every native library it uses is
# reached through a sibling `bilbycast-*-rs` crate behind an optional,
# off-by-default feature. Default OFF, Rockchip-only. Sibling-path dependency,
# mirroring `mxl-rs` / `decklink-rs`.
rga-rs = { path = "../bilbycast-rga-rs/rga-rs", optional = true }

# System resource monitoring (CPU, RAM)
sysinfo = "0.39.6"

# Error handling
anyhow = "1.0.104"

# Auth (JWT / HMAC-SHA256)
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
serde_urlencoded = "0.7.1"
subtle = "2.6"

# Secrets encryption at rest (AES-256-GCM for secrets.json)
aes-gcm = "0.11.1"
# Pure-Rust CENC ciphers for CMAF output (Common Encryption ISO/IEC 23001-7):
#   cenc scheme → AES-128-CTR, cbcs scheme → AES-128-CBC with 1:9 block
#   pattern. RustCrypto audited crates, MIT/Apache-2.0. Tiny binary cost.
aes = "0.9"
ctr = "0.10"
cbc = "0.2"

# UUID for flow IDs
uuid = { version = "1.27.0", features = ["v4", "v5", "serde"] }

# WebSocket client for manager connection
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1.0.9"
futures-util = "0.3.34"
url = "2.5.8"

# Netlink (gateway-mode bonded-path policy routing — engine::bond_routing).
# Pure Rust; uses the edge process's CAP_NET_ADMIN at runtime.
#
# THESE TWO MOVE TOGETHER, ALWAYS. `engine::bond_routing` passes RouteMessage /
# RuleMessage / RuleAction straight between the two crates, so resolving two
# netlink-packet-route versions into the graph makes those types stop unifying
# (E0308: "multiple different versions of crate netlink_packet_route").
# rtnetlink is what pins the pair — each release requires exactly one
# netlink-packet-route range:
#     rtnetlink 0.21 -> netlink-packet-route ^0.30
#     rtnetlink 0.22 -> netlink-packet-route ^0.32.1
#     rtnetlink 0.23 -> netlink-packet-route ^0.33
# Bump ours only in lockstep with rtnetlink's requirement, never ahead of it.
#
# Moving rtnetlink 0.21 -> 0.23 drags THREE more 0.x majors that we never name
# in this manifest: netlink-packet-core 0.8.2 -> 0.9.0, netlink-proto
# 0.12.1 -> 0.13.0 and netlink-sys 0.8.8 -> 0.9.0. Those own the socket and the
# async framing under rtnetlink, and they were resolved, not source-audited —
# so the bench verification below is covering five crates, not two.
#
# 0.30 -> 0.33 carried no source edits here: the 0.31/0.32/0.33 breaking changes
# are in the link / vxlan / tc modules plus a zerocopy rewrite of the *buffer*
# parsing types, and RouteMessage, RouteHeader, RouteAttribute, RuleMessage,
# RuleHeader, RuleAction and RuleAttribute — the whole of what we touch — are
# unchanged. That zerocopy rewrite is nonetheless the one thing to watch: it
# rewrote the parse path that feeds `route_table()` and `rule_priority()`, and a
# regression there would be SILENT (a healthy leg reported dead by `is_intact`,
# a GC sweep that removes nothing) rather than a crash — `is_intact` and
# `del_*` drive their dumps with `while let Ok(Some(..))`, which cannot tell a
# failed dump from an empty one. And the exposure is wider than the two fields
# we read: `del_rules_with_priority` / `del_routes_in_table` / `gc_reserved`
# hand the DUMPED message straight back to the kernel as RTM_DELRULE /
# RTM_DELROUTE, so every attribute round-trips through the new parser, not just
# `route_table()` and `rule_priority()`. The netlink calls need a live kernel +
# CAP_NET_ADMIN and no unit test covers them, so a green build is not evidence.
# Verify on a bench host that also carries a nexthop-group or multipath route
# (the 0.32 additions most likely to round-trip differently): program a
# gateway-mode leg, check `ip rule show` / `ip route show table <T>` against
# what `program()` claims, then kill the edge and confirm the startup GC sweep
# removes the orphans on the next boot.
rtnetlink = "0.23"
netlink-packet-route = "0.33"

# ── SRT backend ──────────────────────────────────────────────────────────
# Haivision libsrt wrapper. Native SRT bonding, guaranteed FEC/encryption
# interop with all SRT devices. Build needs CMake, OpenSSL headers, clang.
#
# This block used to say the sibling pure-Rust `bilbycast-srt` could be
# swapped in by commenting one pair and uncommenting another, with "no other
# code changes needed". **That is not true and has not been for some time.**
# When native SRT bonding landed, the edge began referencing socket-group
# types unconditionally — `SrtGroup`, `SrtGroupBuilder`, `GroupMode`,
# `GroupMemberStats`, `MemberStatus` — and only the libsrt wrapper provides
# them. A swap fails with 9 compile errors, all of that shape (issue #102).
#
# Nothing builds the alternative, so the claim rotted silently. It is removed
# rather than repaired: libsrt is the backend. `bilbycast-srt` still exists as
# a wire-compatible pure-Rust implementation and is maintained on its own
# terms, but it is not currently a drop-in for this crate. Restoring that
# would mean feature-gating the whole bonding surface here.
# ─────────────────────────────────────────────────────────────────────────
srt-transport = { path = "../bilbycast-libsrt-rs/srt-transport" }
srt-protocol = { path = "../bilbycast-libsrt-rs/srt-protocol" }

# ── RIST backend ─────────────────────────────────────────────────────────
# Pure-Rust RIST Simple Profile (TR-06-1:2020). Zero C dependencies.
# Wire-verified interop with librist 0.2.11 (ristsender / ristreceiver).
# No feature flag — always compiled in, same treatment as SRT above.
# ─────────────────────────────────────────────────────────────────────────
rist-transport = { path = "../bilbycast-rist/rist-transport" }
rist-protocol = { path = "../bilbycast-rist/rist-protocol" }

# ── Bonding stack ────────────────────────────────────────────────────────
# Media-aware multi-path bonding (Peplink-class). Pure-Rust reassembly +
# scheduler; path transports include UDP, QUIC, and RIST. Edge consumes it
# to expose `BondedInputConfig` / `BondedOutputConfig` as new flow input /
# output variants. Non-bonded flows don't touch this code.
# ─────────────────────────────────────────────────────────────────────────
bonding-transport = { path = "../bilbycast-bonding/bonding-transport", default-features = false, features = ["path-udp", "path-rist", "path-quic"] }
bonding-protocol = { path = "../bilbycast-bonding/bonding-protocol" }

# QUIC transport for IP tunneling (relay and direct modes)
quinn = "0.11.12"
# rustls and rustls-pemfile are always needed (tunnel subsystem uses QUIC/TLS)
rustls = { version = "0.23.45", features = ["ring"] }
# AEAD encryption for end-to-end tunnel encryption (ChaCha20-Poly1305)
ring = "0.17.14"
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"

# EBU R128 loudness + true-peak measurement for the Audio Full
# content-analysis tier. Pure-Rust (Sebastian Dröge's port of libebur128);
# no external C dependency.
ebur128 = "0.1"

# MP4 / MOV demuxer for the file-backed media-player input. Pure
# Rust, ISO-BMFF parser only (no encode / no decode); we feed the
# extracted ES through the existing TsMuxer. Used only when a flow has a
# `MediaPlayerSource::Mp4` source attached.
mp4 = "0.14"

# JPEG / PNG / WebP / GIF decoder for the still-image media-player
# source ("slate"). Pure Rust, default features off — we only need the
# common still formats and the YUV420P conversion lands inline.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }

# ── Remote upgrade plumbing ──────────────────────────────────────────────
# Tar + gzip extraction for `versions/<v>/<binary>` from the released
# tarball, semver comparison for `min_version` / `rollback_grace`, file
# locks for `state.json`, and Sigstore keyless-signature verification
# (Fulcio cert chain, identity allowlist, Rekor inclusion proof).
# All pure-Rust crates — `flate2` defaults to its `miniz_oxide` backend so
# we don't pull zlib at link time; `sigstore` ships the Fulcio CA root +
# Rekor public key as compiled-in constants.
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
semver = { version = "1.0", features = ["serde"] }
fs2 = "0.4"
sigstore = { version = "0.14", default-features = false, features = ["sigstore-trust-root", "cached-client"] }
# HELD at 0.2 deliberately — x509-cert 0.3.0 is out, but sigstore 0.14 (the
# latest) still requires ^0.2. Bumping ours alone resolves BOTH into the graph,
# putting a second X.509 parser in the upgrade-signature verification path for
# no functional gain (we only need `Certificate::from_der` + extension access,
# and we hand sigstore raw SPKI/signature bytes, never a shared type). Move
# this in lockstep with sigstore, not ahead of it.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[features]
# `display` is in the default feature set: every Linux release variant
# (default + full) ships the local-display output. The optional `drm` /
# `alsa` deps are themselves target-gated to `cfg(target_os =
# "linux")`, so a default `cargo build` on macOS still compiles cleanly
# (the optional deps simply aren't selected, and the runtime spawner
# refuses with `display_device_invalid`). On a headless Linux host the
# feature stays dormant — `enumerate_displays()` returns empty, the
# `"display"` capability isn't advertised, and the manager UI hides the
# option per-node.
default = ["tls", "webrtc", "fdk-aac", "media-codecs", "replay", "display"]
# Replay server: continuous flow recording to disk + playback as a fresh
# input. Adds the `recording` flow attribute and the `replay` input type.
# Pure-Rust, no new C deps. See `src/replay/` and `docs/replay.md`.
replay = []
# Enable in-process AAC decode/encode via Fraunhofer FDK AAC (C library).
# Replaces symphonia (decode) and ffmpeg subprocess (AAC encode).
fdk-aac = ["dep:aac-audio", "dep:aac-codec"]
# FFmpeg / libav base codec layer. Bundles:
#   - Universal CPU video decode (H.264 / HEVC / MPEG-2) via libavcodec —
#     used by transcode input decode, content analysis (video_full),
#     display output fallback, ST 2110-20/-23 input mux, replay filmstrip.
#   - Audio decode for Opus / MP2 / AC-3 / E-AC-3 via libavcodec — used
#     by transcode, content analysis (audio_full), display output.
#   - Audio encode for Opus / MP2 / AC-3 via libavcodec + libopus —
#     used by every TS-bearing output's `audio_encode`.
#   - JPEG thumbnail encode via libswscale.
#   - HW probe scaffolding (the runtime `avcodec_open2` checks in
#     `engine::hardware_probe` for NVENC / QSV / VAAPI).
# All five of the above ride on the same vendored FFmpeg build in
# `bilbycast-ffmpeg-video-rs` (single all-or-nothing crate today), so
# splitting them into sub-features is staged for when an upstream
# Cargo-feature split lands there. AAC is independent — see `fdk-aac`.
# Default on; off-builds compile cleanly and fall back to no-thumbnail,
# AAC-only audio, and SRT/RIST/RTP/UDP/RTMP/HLS/CMAF/WebRTC protocol
# passthrough.
media-codecs = ["dep:video-engine", "dep:video-codec"]
# Enable libx264 H.264 video encoding inside the vendored FFmpeg build.
# **LICENSING:** libx264 is GPL v2+. Binaries built with this feature
# are an AGPL-3.0-or-later combined work (see NOTICE.full). Requires
# libx264-dev (or equivalent) installed on the host. Off by default;
# enabled by the `video-encoders-full` composite in the `*-full`
# release artefact.
video-encoder-x264 = ["media-codecs", "video-engine/video-encoder-x264"]
# Enable libx265 HEVC video encoding. Same licensing implications as
# `video-encoder-x264` (GPL v2+). Off by default.
video-encoder-x265 = ["media-codecs", "video-engine/video-encoder-x265"]
# Enable NVENC hardware H.264/HEVC encoding. Royalty-free at the API
# layer; requires an NVIDIA driver at runtime and nv-codec-headers at
# build time. Off by default.
video-encoder-nvenc = ["media-codecs", "video-engine/video-encoder-nvenc"]
# Enable Intel QuickSync hardware H.264/HEVC encoding via Intel oneVPL.
# Royalty-free at the API layer (libvpl headers + dispatcher are
# MIT/Apache); x86_64 only in practice. Requires `libvpl-dev` at build
# time and the Intel media driver + libvpl runtime on the host. Off by
# default.
video-encoder-qsv = ["media-codecs", "video-engine/video-encoder-qsv"]
# Enable VAAPI hardware H.264/HEVC encoding (Linux). Royalty-free at
# every layer (libva is MIT, FFmpeg's VAAPI wrapper is LGPL). Primary
# motivation: AMD-on-Linux encode (the only royalty-clean path on AMD).
# Requires `libva-dev` at build time and a working VAAPI driver at
# runtime — Mesa radeonsi for AMD, iHD for Intel. Off by default. The
# v1 encoder accepts 8-bit 4:2:0 input (YUV420P → NV12 upload via
# `av_hwframe_transfer_data`); 10-bit P010 + 4:2:2 / 4:4:4 are valid
# VAAPI surface layouts but each demands a distinct upload packer that
# is staged for a follow-up.
video-encoder-vaapi = ["media-codecs", "video-engine/video-encoder-vaapi"]
# RKMPP (Rockchip Media Process Platform) hardware H.264/HEVC encode on
# ARM Rockchip SoCs (RK3568 / RK3588). Adds `--enable-rkmpp
# --enable-libdrm --enable-encoder=h264_rkmpp/hevc_rkmpp` to the vendored
# FFmpeg build and links `librockchip_mpp` + `libdrm`. Both encoders are
# 8-bit 4:2:0 only. Royalty-free (MPP is LGPLv3, FFmpeg's wrapper is
# LGPL — no GPL/nonfree). Build prereqs: the Rockchip BSP
# `librockchip-mpp-dev` (>= 1.3.8, ships `rockchip_mpp.pc`) + `libdrm-dev`;
# runtime needs the MPP kernel driver (`/dev/mpp_service`). Deliberately
# NOT in `video-encoders-full` (that composite targets x86_64, which has
# no `rockchip_mpp`) — the aarch64 `*-full` release job lists it
# explicitly alongside the other aarch64 features. Off by default; only
# buildable on a native aarch64 Rockchip host.
video-encoder-rkmpp = ["media-codecs", "video-engine/video-encoder-rkmpp"]
# Bundle every video codec backend the edge knows about — encoders
# (x264 + x265 + NVENC + QSV + VAAPI) AND HW decoders for the display
# output (NVDEC + QSV-decode + VAAPI-decode). Used by the GitHub
# Actions release matrix to produce the `*-full` artefact on x86_64.
# At runtime, operators pick the per-flow codec; NVENC / NVDEC
# activate only on hosts with NVIDIA driver + hardware, QSV
# (encode + decode) only on hosts with an Intel iGPU + media driver,
# VAAPI activates on AMD (Mesa radeonsi) or Intel (iHD) hosts,
# otherwise x264 / x265 run on CPU and the display output falls back
# to libavcodec software decode. The runtime probe in
# `engine::hardware_probe` auto-detects which backends the host can
# actually open and only those land on `HealthPayload.capabilities`.
# Inherits libx264's + libx265's GPL v2+ terms — the resulting binary
# is an AGPL-3.0-or-later combined work (see NOTICE.full). Build
# prereqs: `nv-codec-headers` (NVENC + NVDEC share it), `libvpl-dev`
# (QSV encode + decode share it), and `libva-dev` (VAAPI encode +
# decode share it). `aarch64` builds intentionally drop the QSV bundle
# (Intel iGPU is x86_64-only) and list the remaining features
# explicitly in the release workflow.
video-encoders-full = [
    "video-encoder-x264",
    "video-encoder-x265",
    "video-encoder-nvenc",
    "video-encoder-qsv",
    "video-encoder-vaapi",
    # HW decoders — used by both the display output (when the `display`
    # feature is also on, which it is in the default set) and the
    # transcode input-decode path.
    "video-decoder-nvdec",
    "video-decoder-qsv",
    "video-decoder-vaapi",
]
# Distributed multiviewer — the mosaic compositor and its stream head.
#
# **Off by default and deliberately so**, on the same reasoning as the
# encoder features it depends on. A multiviewer wall is a specific
# deployment choice, not something every contribution node should carry:
# a head composites N decoded tiles into a canvas every frame, which is
# the most expensive thing this binary can be asked to do, and it is
# pure cost on a node that will never run a wall.
#
# It also cannot work without one: the composite reaches SRT / RTP / UDP
# / WebRTC / CMAF by being **encoded and muxed onto the flow's MPEG-TS
# bus**, so a build with no video encoder has nothing to publish. That
# is not a theory — a default `cargo build` resolves every encoder
# backend to `FeatureDisabled`. The feature therefore requires
# `media-codecs` for tile decode and leaves the choice of encoder to the
# operator, exactly as transcoding does; `engine::mosaic` refuses to
# start with a named reason when none was compiled in, rather than
# failing obscurely at the first frame.
#
# Enable it alongside whichever encoder suits the host, e.g.
#   cargo build --features "multiviewer,video-encoder-x264"   (GPL v2+)
#   cargo build --features "multiviewer,video-encoder-nvenc"  (LGPL-clean)
# The `*-full` release artefacts carry `video-encoders-full`, so adding
# `multiviewer` there needs no further encoder choice.
multiviewer = ["media-codecs"]
# Local-display output — decode the flow's video + audio and render to a
# Linux KMS connector (HDMI / DisplayPort) plus an ALSA audio device.
# Linux-only (the optional `drm` / `alsa` deps are target-gated below).
# `drm-rs` is pure-Rust ioctls over /dev/dri (no libdrm at link time);
# `alsa` links libasound2, so `apt install libasound2-dev` (Debian /
# Ubuntu) or the equivalent RPM is required for the build. Off by
# default so generic builds stay portable. Audio decode of MP2 / AC-3 /
# E-AC-3 / Opus rides through the `media-codecs` `AudioDecoder`
# (libavcodec). See `docs/configuration-guide.md` "Display output
# (HDMI / DisplayPort)".
display = [
    "dep:drm",
    "dep:alsa",
    "media-codecs",
    "fdk-aac",
]
# MXL (Media eXchange Layer) input + output. Three essence variants
# each side — `mxl_video` (V210 4:2:2 10-bit), `mxl_audio` (Float32 PCM @
# 48 kHz), `mxl_anc` (RFC 8331 ANC) — mirroring the ST 2110-20/-30/-40
# pattern. PTP-enforced at validation. Same-host shared-memory only at
# v1.0 (no cross-host Fabric API). See
# `bilbycast-edge/docs/mxl-integration-plan.md` for the architectural
# rationale and `bilbycast-mxl-rs/CLAUDE.md` for the build prereq
# footprint (clang + cmake + ninja + bison + flex + lld + GStreamer dev
# + vcpkg + `CC=clang CXX=clang++`). Default OFF.
mxl = ["dep:mxl-rs"]
# SDI capture/playout via Blackmagic DeckLink (`sdi` input/output type).
# Pulls the `decklink-rs` SDK wrapper (direct DeckLink SDK, not libavdevice).
# The SDI input encodes captured video (video_encode required) + embedded
# audio into one A+V MPEG-TS; the SDI output decodes the flow and schedules
# it onto the card. Needs the SDK headers (`DECKLINK_SDK_DIR`) and a
# video-encoder-* backend. Default OFF. See
# `bilbycast-decklink-rs/CLAUDE.md`.
#
# Shipped in every `*-full` release artefact — the workflow lists this
# feature explicitly on both arches and materialises the SDK headers from
# a repo secret first. Deliberately NOT folded into `video-encoders-full`:
# that composite is "every video codec backend", and SDI is an I/O type,
# not a codec. Folding it in would also drag the EULA-gated SDK onto every
# local `--features video-encoders-full` build (`libdecklink-sys/build.rs`
# panics without `DECKLINK_SDK_DIR`), so a contributor wanting x264 + x265
# would have to go and accept a Blackmagic licence first. Same reasoning
# as `video-encoder-rkmpp`, and the same shape as `mxl` / `display`, which
# are likewise listed per-arch in the workflow rather than composited.
#
# Runtime is autodetect, exactly like NVENC: the SDK's DeckLinkAPIDispatch
# dlopens `libDeckLinkAPI.so`, so a host without Desktop Video or without a
# card simply fails the boot probe (`engine::decklink::domain`), the
# `sdi-decklink` capability never reaches `HealthPayload.capabilities`, and
# the manager hides SDI for that node. Nothing to configure either way.
sdi-decklink = ["dep:decklink-rs"]
# Skip the upstream libmxl C++ cmake build inside mxl-sys. bindgen still
# generates dlopen-based FFI bindings from the vendored headers; the
# resulting binary loads libmxl.so at runtime via `libloading`. Used by
# the CI release workflow so the heavy build chain (cmake + ninja + vcpkg
# + GStreamer-dev + bison + flex + lld) is not required on the runner.
# Operators deploy libmxl.so on the host; the boot probe gates MXL
# capabilities on its presence.
mxl-not-built = ["mxl-rs/mxl-not-built"]
# Hardware-decoded video, used on both the display output AND the
# transcode (TS → TS) decode path. Each feature pulls in the matching
# `video-engine/video-decoder-*` family. When the feature is on AND
# the runtime probe confirms the host has the driver / hardware, the
# transcode resolver picks it for the input decode side of a flow's
# `video_encode` block, and the manager UI surfaces the matching
# backend in the display output's "Video Decoder" dropdown. The edge
# advertises `video-decoder-nvdec` / `video-decoder-qsv` /
# `video-decoder-vaapi` on `HealthPayload.capabilities`. Operators
# who want HW transcode decode + the display output simply enable the
# `video-decoder-*` feature with the default-on `display` feature; no
# separate `display-*` composite exists.
video-decoder-nvdec = ["video-engine/video-decoder-nvdec"]
video-decoder-qsv = ["video-engine/video-decoder-qsv"]
# VAAPI HW decode (Linux). The decoder is fully wired with VAAPI
# device + frames-context plumbing in `video-engine` and surfaces
# frames either as zero-copy DRM PRIME DMA-BUFs (KMS scanout via the
# `display` feature) or system-memory NV12/P010 (HDR tonemap path).
video-decoder-vaapi = ["video-engine/video-decoder-vaapi"]
# RKMPP HW decode (ARM Rockchip only). Plain named decoder like NVDEC/QSV —
# system-memory NV12 output, no hwframe-context plumbing needed. Off by
# default; only buildable on a native aarch64 Rockchip host. Same
# per-arch listing convention as `video-encoder-rkmpp` (not folded into
# `video-encoders-full`, which is x86_64-only).
video-decoder-rkmpp = ["video-engine/video-decoder-rkmpp"]
# RGA-accelerated DRM_PRIME→sysmem transfer (ARM Rockchip only, requires
# `video-decoder-rkmpp`). The generic FFmpeg `av_hwframe_transfer_data`
# path (`hwcontext_drm.c`) does an unaccelerated CPU mmap + DMA_BUF_SYNC +
# memcpy on every frame — measured as the dominant per-frame cost behind
# the HDMI display-output stutter on bilby-pir6s (RK3588), with spikes up
# to ~106ms. This feature instead uses the Rockchip 2D accelerator (RGA,
# `librga`) to do the same DRM_PRIME dma-buf → sysmem NV12 copy in
# hardware — benchmarked on bilby-pir6s at ~3ms/frame (1080p), a ~30x
# improvement, with none of the VOP2 plane-class risk of the (currently
# disabled) zero-copy KMS scanout attempt: presentation stays on the
# proven CPU-blit primary-plane path, only the transfer step changes.
# The RGA path also carries a large (~340-400ms), fixed pipeline
# latency the audio-vs-video pacer can't tell apart from a real
# backlog on its own — `output_display.rs`'s one-time A/V calibration
# (gated on the shared `rga_transfer_active` flag) measures and
# corrects for it in the first ~1.5s after engagement. Without that
# calibration this feature is a net *regression* (measured: ~31%
# dropped frames vs. ~11% on the plain CPU path it replaces) despite
# genuinely lower per-frame cost — don't disable/bypass the
# calibration logic without re-verifying the drop rate on hardware.
# Off by default; needs the `librga` headers at build time and `/dev/rga`
# at run time, plus systemd `DeviceAllow=/dev/rga rwm` under a hardened
# unit (see `packaging/bilbycast-edge.service`).
#
# The `librga` FFI itself lives in the sibling `bilbycast-rga-rs`
# workspace, reached via the optional `rga-rs` dependency — the edge
# carries no build.rs and no bindgen, exactly as with `mxl` / `sdi-decklink`.
rga-transfer = ["video-decoder-rkmpp", "dep:rga-rs"]
# Enable TLS (HTTPS on API + RTMPS) support via rustls/tokio-rustls/axum-server.
tls = ["dep:tokio-rustls", "dep:axum-server"]
# Enable WebRTC WHIP/WHEP input and output via str0m (pure Rust, sans-I/O).
webrtc = ["dep:str0m"]
# Enable live NVIDIA NVENC / NVDEC utilization sampling via nvml-wrapper
# for the manager's resource-budget UI. Linux + Windows only (the dep is
# target-conditional). Off by default so a generic `cargo build` stays
# portable; enable on release builds for those platforms.
hardware-monitor-nvml = ["dep:nvml-wrapper"]
# (SMPTE ST 2110 — Phase 1) Optional in-process PTP slave clock via the
# pure-Rust `statime` crate. The default deployment runs `ptp4l` (linuxptp)
# externally and bilbycast reads its management socket; this feature exists
# for simpler deployments that prefer a single-process model. The flag is
# wired through the build matrix in step 2; the actual `statime` integration
# (and dependency declaration) lands in a follow-up step. Until then the
# feature is a no-op marker — `cargo build --features ptp-internal` succeeds
# and the reporter still falls back to ptp4l.
ptp-internal = []

[dependencies.tokio-rustls]
version = "0.26.6"
optional = true

[dependencies.axum-server]
version = "0.8.0"
features = ["tls-rustls"]
optional = true

[dependencies.str0m]
# 0.24.1, up from 0.23.1. The edge compiles against it unchanged. The only
# other lock movement is the vendored `is`: str0m 0.24 requires `is ^0.11.1`,
# which the 0.11.0 vendor tree cannot satisfy, so it was re-vendored (see
# [patch.crates-io] below). str0m's other raised floors (dimpl ^0.7.4,
# sctp-proto ^0.10.5) were already locked. Feature table (`openssl`,
# `vendored`) and MSRV (1.85.0) are unchanged.
#
# Correction to the previous entry here: 0.23.0 -> 0.23.1 was not only the
# sctp-proto floor. It also shipped #1029, which hardens SRTP/SRTCP and RTCP
# parsing against malformed input (parse-side only, no API change).
#
# 0.24's breaking changes, none of which reach us:
#   * RED (#982) adds a `use_red: bool` to `enable_opus` / `enable_pcmu` /
#     `enable_pcma` / `enable_g722`. Of those we call only `enable_opus`, as
#     `enable_opus(true, false)` (no RED), since the codec set is now built
#     from `clear_codecs` (see the codec-set entry below); H.264 goes through
#     `add_h264`, which is unchanged.
#   * `BweKind` variants carry named fields (#1048). We never enable bandwidth
#     estimation, and `session::handle_event` ends in `_ => None`.
#   * New `Codec` / `CodecExtra` / `PacketError` / `Reason` variants, matched
#     nowhere. `MediaKind` is still `Audio | Video`.
# Everything else we call (`Writer::write`, `sdp_api()`, `Candidate::host`,
# `net::Receive`, `MediaData`, `KeyframeRequest`, ...) is signature-identical.
# On the write path the per-media queue grew from 100 to 512 entries and is
# ordered by wallclock instead of FIFO; every caller passes `Instant::now()`
# and drains between writes, so nothing reorders.
#
# Visible on the wire or in behaviour:
#   * transport-cc is negotiated per payload type (part of #1046): our answer
#     carries `a=rtcp-fb:<pt> transport-cc` only for a PT the offer gave it
#     on. ffmpeg's WHIP offers give it on none, so our answers to ffmpeg stop
#     echoing it. Chrome's offers carry it, and edge <-> relay is unchanged
#     because str0m always offers it.
#   * Receive reordering (WHIP ingest and the WHEP-client input) now has a
#     deadline by default: 2 s video, 1 s audio (#1041, #1057). An incomplete
#     video frame ahead of the first complete one holds every later frame back
#     until it completes (NACK/RTX) or expires, where 0.23 skipped it once 30
#     complete frames had queued behind it — so a packet lost for good inside a
#     multi-packet frame stalled video for up to 2 s instead of about 1 s
#     (measured on the relay: 1.02 s -> 2.03 s without RTX, 67 ms either way
#     with it). `engine::webrtc::session` therefore sets
#     `set_reordering_timeout_{video,audio}(None)`, which restores 0.23's
#     count-only release exactly.
#   * A receive stream for SSRC 0 (libwebrtc's pre-media bandwidth probes) no
#     longer counts toward RTCP report scheduling (#1052). On 0.23 it never
#     sent a report, so its report deadline stayed in the past and the
#     timeout `poll_output` handed back was always already due: a busy loop
#     for our sans-I/O driver once a peer sent one such probe.
#   * An offered `a=msid:-` is no longer echoed into the answer (#1060);
#     stopped m-lines carry no msid/ssrc lines (#1063).
# Inert for us: the SCTP send buffer (#1062, no data channels), the paced
# burst cap (#1058, BWE only), opt-in RED and telephone-event, the audio-level
# VAD bit (#1032) and the DTLS pre-initialisation guards.
#
# Earlier bumps: 0.23.0 added RTCP XR DLRR replies (#1022) and changed the
# originator SSRC of the XR reports we send as a receiver (#1027). Of
# 0.19 -> 0.22 only `MediaData.data` becoming `Arc<[u8]>` (0.20) reached us,
# handled in `engine::webrtc::session`.
#
# NOT verified live, now three bumps deep: WHIP/WHEP interop against ffmpeg,
# OBS and a browser, and quality gates 3 / 7 / 9. 0.23 changed the RTCP we
# send and 0.24 the SDP we answer and the receive timing.
#
# The codec set, fixed after this bump (the defect predates it and reproduced
# in a standalone probe on 0.23.1 and on 0.24.1). `engine::webrtc::session`
# used to keep str0m's default set and add four level-5.1 `add_h264` entries
# beside the level-3.1 built-ins. Since str0m 0.22 (#1016) a level mismatch
# only lowers the match score, so where the peer's PTs are binding both
# entries for one profile locked the same remote PT and str0m panicked ("Pt
# locked multiple times", `payload_params.rs:41`): `accept_offer` on every
# Chrome WHEP offer, killing the WHEP output's task for all later viewers,
# and `accept_answer` on a single-PT H.264 answer. The first extra also put
# its RTX on PT 111, Opus's own, so Opus was answered on another PT (110,
# Chrome's telephone-event, in a Chrome publish); a High 5.1 FFmpeg publish
# was answered on PT 118 while FFmpeg sends on 106; and with VP8 in the set,
# VP8 headed a browser publish's answer, and an edge's WHIP output wrote its
# H.264 to another edge on VP8's PT 96 (its Opus on 104).
# `session::rtc_config` now builds `clear_codecs()` + `enable_opus(true,
# false)` + str0m's seven built-in H.264 entries re-registered at level 5.1
# (same PT, RTX PT, packetization-mode and profile; only the level byte is
# 0x33). Answers carry H.264 and Opus only, at level 5.1; `get_pt` picks the
# H.264 / Opus PT by codec; and every negotiation step runs under
# `catch_unwind`, so a str0m panic fails that peer alone with a
# `webrtc_negotiation_panic` Warning. One is still reachable on 0.24.1 with
# any H.264 set str0m ships: an offer (or answer) whose one RTX PT repairs two
# H.264 PTs locks that RTX PT twice. The tests keep it as a fixture
# (`engine/webrtc/testdata/rtx-repairing-two-pts.sdp`); when a str0m bump
# stops panicking on it, those tests say so. bilbycast-relay's
# `distribution::webrtc::session` must register exactly the same set. Checked
# against captured real SDP (Chrome 124 WHEP and WHIP offers) and FFmpeg's
# own WHIP offer template in unit tests, then live in the 2026-10 interop run
# (headless Chromium 124 publishing and viewing, through the edge and the
# relay, edge to edge).
#
# UPGRADE ORDER, from this codec set on. An edge built before it — any tree
# before the codec-fix merge 5f71c4c (main through 8f4bf2c), and every
# release up to v0.113.0 — panics in its WHIP output on the answer a relay or
# an edge carrying this set gives it ("Pt locked multiple times: 110", in
# `accept_answer`, which that build does not isolate), and the output's task
# ends: nothing is published until the flow restarts. A fixed WHIP output
# publishing into an old relay or edge works. So upgrade every edge that
# carries a WHIP output FIRST, then the relays and the edges with WHIP inputs
# it publishes into. Reproduced live in the 2026-10 interop run, edge to relay
# and edge to edge. The release notes say so too (.github/release-notes/
# edge.md, "Upgrading from v0.113.0 or earlier").
#
# The vendored `is` PRIORITY patch used to let a PRIORITY-less Binding Request
# reach a panicking `expect`, in the media path after negotiation, where the
# isolation above does not reach. Also fixed after the bump, in the vendored
# tree itself (see [patch.crates-io] below).
version = "0.24.1"
optional = true
# Use OpenSSL DTLS backend instead of the default aws-lc-rs + dimpl. The
# pure-Rust dimpl DTLS implementation stalls when the active side (WHEP
# client) is talking to a localhost passive server (str0m WHEP server) —
# DTLS handshake never reaches Connected even though ICE succeeds and the
# server's certificate is received. The OpenSSL backend uses a battle-tested
# DTLS stack and avoids this. Adds an OpenSSL build-time dep but bilbycast
# already links OpenSSL via libsrt-rs so no new system requirement.
default-features = false
features = ["openssl"]

[dependencies.reqwest]
version = "0.13.5"
default-features = false
# Used by:
#  - WebRTC WHIP client signaling (feature-gated imports inside engine::webrtc)
#  - CMAF output HTTP push ingest (segment / init / manifest PUTs)
# rustls is the only TLS backend; `stream` enables Body::wrap_stream for
# streaming uploads (CMAF-LL chunked transfer). `http2` carries cleartext
# HTTP/2 (h2c) prior-knowledge support for the hand-rolled Starlink dish
# gRPC client in util::starlink (no tonic/prost — pure-Rust, purity holds).
features = ["rustls", "stream", "http2"]

[dependencies.retina]
# 0.4.20 (2026-08-14), up from 0.4.19. The one entry in the 2026-08-21 freshness
# sweep that is NOT cosmetic: 0.4.20 moved the RTSP read + depacketize path onto
# an internal ring buffer, replacing the `tokio_util::codec::Framed` approach, to
# cut read syscalls and allocations (upstream measures the client/h264 bench
# 2.1 -> 4.6 GiB/s). The dependency set moves with it — `tokio-util` dropped,
# `socket2 ^0.5` added, tokio floor 1.11 -> 1.13 — so the edge graph now carries
# socket2 0.5 alongside our own 0.6. Harmless (no socket2 type crosses that
# boundary) but it is why the lock gained a second socket2 major.
#
# Upstream's own caveat: the direct packet API (`Session<Playing> as Stream`)
# now copies each packet into a fresh `Bytes` where the old Framed path could
# hand over a pre-sized BytesMut. `engine::input_rtsp` uses the higher-level
# `Demuxed` stream, which upstream says is the unaffected path — but that is
# upstream's judgement, not a measurement of ours. 0.4.20 also accepts a
# schemeless `Content-Base` header, which some cameras send.
#
# 0.4.21 (2026-10-07 sweep): camera-compatibility fixes, dependency set and
# features unchanged. An `ssrc` of four or fewer hex digits in the SETUP
# `Transport` header is now ignored with a warning (learned from the first
# packet) instead of failing SETUP; the undefined `ssrc` some Reolink and Dahua
# firmware put in the PLAY `RTP-Info` header is now ignored rather than parsed;
# and keepalives prefer `GET_PARAMETER` over `SET_PARAMETER` (Tapo cameras
# answer the latter with `400`). All three widen what connects; none changes a
# stream that already worked.
#
# NOT verified on a real camera. RTSP ingest wants a live run before a release.
version = "0.4.21"

# Pure-Rust mDNS-SD service registration for NMOS IS-04 discovery
# (`_nmos-node._tcp`). Best-effort: registration is gated at runtime so
# environments without multicast on the chosen interface degrade cleanly.
[dependencies.mdns-sd]
version = "0.21.5"

[dev-dependencies]
tempfile = "3.27.0"

# NVIDIA NVML — live NVENC / NVDEC utilization for the resource-budget
# block on the manager UI. Optional; gated on the `hardware-monitor-nvml`
# feature. Linux + Windows targets only — the dep doesn't compile on
# macOS / BSD because it links libnvidia-ml at runtime. Enable explicitly
# on release builds for those targets; the rest stays cleanly opt-out.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = { version = "0.13", optional = true }

# Local-display output — Linux-only. `drm` is the pure-Rust drm-rs
# crate (ioctl-based KMS, /dev/dri/cardN, no libdrm linkage), `alsa`
# wraps libasound2. Both are `optional = true` and gated by the
# `display` Cargo feature; non-Linux builds short-circuit
# `enumerate_displays()` to `Vec::new()` and never advertise the
# capability. Build prereqs: `apt install libasound2-dev` on Debian /
# Ubuntu (no libdrm-dev needed — drm-rs goes straight to ioctls).
# Connector enumeration walks `/sys/class/drm` directly via std::fs,
# so libudev is not in the link graph.
[target.'cfg(target_os = "linux")'.dependencies]
drm = { version = "0.15", optional = true }
alsa = { version = "0.12", optional = true }

# Pure-Rust D-Bus client for reading cellular modem state from ModemManager
# (org.freedesktop.ModemManager1) — powers util::cellular's zero-config USB /
# PCIe modem telemetry. The `tokio` feature runs it on the existing runtime;
# no C deps, so testbed/check-binary-purity.sh stays green. Linux-only (D-Bus
# + ModemManager); the RutOS HTTP source (reqwest) is cross-platform.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# ---------------------------------------------------------------------------
# BILBYCAST PATCH: vendored `is` 0.11.1, patched in two places so an ICE
# Binding Request without the PRIORITY attribute is answered rather than
# rejected (src/stun.rs) or panicked on (src/agent.rs). Originally vendored
# against `is` 0.8.0 (2026-04-09); re-vendored against 0.9.0 (2026-05-12,
# str0m 0.19), 0.11.0 (2026-08-11, str0m 0.22) and 0.11.1 (2026-10-07, str0m
# 0.24, which requires ^0.11.1). Upstream still hard-rejects PRIORITY-less
# Binding Requests in 0.11.1: its `src/stun.rs` is byte-identical to 0.11.0's.
# 0.11.1 changed only agent.rs and pair.rs — candidate invalidation now also
# matches the transport protocol (#1035), and an ICE-lite controlled agent
# marks a pair succeeded when it answers a Binding Request (#1039; read only by
# `Rtc::accepts`, which we never call).
#
# Why: ffmpeg's WHIP muxer sends ICE connectivity-check Binding Requests
# without the PRIORITY attribute in every 8.0.x release (n8.0 through n8.0.3;
# 8.1 added it, and 7.x has no WHIP muxer). RFC 5245 §7.1.2.1 says PRIORITY
# is mandatory, so it's technically a peer bug, but `is` hard-rejects the
# packets at parse time and str0m never even sees them. The result is every
# such publish stalls in ICE, DTLS times out at 5 s, and no media flows. See
# the 2026-04-09 Bug A entry in the monorepo's testbed/QUALITY_REPORT.md
# (since deleted; monorepo commit 0ca3baa has it).
#
# The two hunks, each a comment-replacement block marked `BILBYCAST PATCH`
# with the upstream lines kept beside it:
#   * vendor/is/src/stun.rs, `StunMessage::parse`: the "STUN packet missing
#     priority" rejection is dropped.
#   * vendor/is/src/agent.rs, `IceAgent::stun_server_handle_message`:
#     `message.prio().expect("STUN request prio")` becomes an `unwrap_or` of
#     the RFC 8445 peer-reflexive priority the request should have carried
#     (110 * 2^24 + 65535 * 2^8 + 255; the hunk's comment has the derivation).
#     The stun.rs hunk alone is worse than no patch: the request gets past the
#     parser, passes the integrity check, and panics here, taking the WHIP
#     input task with it.
# History of the second hunk: the original 0.8.0 vendoring (381f5be) carried
# it, with the host-candidate priority 126 * 2^24 + 65535 * 2^8 + 255; the
# 0.9.0 re-vendor (435bc3c) lost it, and every tree from then until 2026-10-08
# carried the stun.rs hunk alone and panicked on ffmpeg 8.0.x (reproduced on
# 0.11.0 at agent.rs:1370 and 0.11.1 at agent.rs:1372). Restored 2026-10-08,
# with the prflx type preference instead of the host one. The tests in
# `engine::webrtc::session` feed a byte-exact ffmpeg 8.0.x request through
# the WHIP input's `Rtc` and fail if either hunk is missing.
#
# WHEN UPGRADING str0m:
#   1. Run `cargo update -p str0m`. If str0m's new `is` requirement is still
#      satisfied by the vendored version, this patch keeps applying — done.
#   2. If it is not, cargo warns `patch `is v...` was not used in the crate
#      graph` and silently builds against the registry `is`. Either:
#        a) re-vendor the matching `is` version (copy from
#           ~/.cargo/registry/src/index.crates.io-*/is-X.Y.Z, re-apply BOTH
#           hunks — vendor/is/src/stun.rs and vendor/is/src/agent.rs — and
#           update this comment), then run the `engine::webrtc::session`
#           tests, OR
#        b) check whether upstream `is` (or str0m) finally accepts a
#           PRIORITY-less Binding Request end to end, parser and agent. If so,
#           drop this entire `[patch.crates-io]` section, the `vendor/is/`
#           tree and the "Vendored is patch is in the crate graph" step in
#           .github/workflows/ci.yml.
#   3. CI enforces that the patch is live: that ci.yml step fails unless
#      `cargo tree --locked -e normal -i is --depth 0` resolves `is` to
#      vendor/is. By hand, the same thing shows in Cargo.lock: the `is` entry
#      carries no `source =` line (a path package) and there is no
#      `[[patch.unused]]` table.
# ---------------------------------------------------------------------------
[patch.crates-io]
is = { path = "vendor/is" }

# Keep line-number debug info in release builds so the SIGSEGV / SIGABRT
# handler in main.rs prints actionable backtraces. Lightweight: line
# tables only, no full debug info — small binary-size impact, no
# perf impact.
[profile.release]
debug = "line-tables-only"
